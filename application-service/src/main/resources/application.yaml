spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: application-service
  datasource:
    url:  jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:credit_conveyor}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_PORT:9092}}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: application-service
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.example.event
        spring.json.value.default.type: com.example.event.ScoringCompletedEvent

    properties:
      spring.json.add.type.headers: false


  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: "${APPLICATION_PORT:8080}"

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

notification:
  fail-enabled: false

topics:
  application:
    created: application.created
  scoring:
    completed: scoring.completed
  issue:
    cancelled: issue.cancelled
