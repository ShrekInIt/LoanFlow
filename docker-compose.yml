services:
  postgres:
    image: postgres:16
    container_name: credit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    networks:
      - credit-network

  scoring-postgres:
    image: postgres:16
    container_name: credit-scoring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SCORING_POSTGRES_DB}
      POSTGRES_USER: ${SCORING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SCORING_POSTGRES_PASSWORD}
    ports:
      - "${SCORING_POSTGRES_PORT}:5432"
    volumes:
      - scoring_postgres_data:/var/lib/postgresql/data
    networks:
      - credit-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: credit-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "${CLUSTER_ID}"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - credit-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: credit-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-credit-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - credit-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: loanflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:13.0.1
    container_name: loanflow-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  scoring_postgres_data:
  kafka_data:

networks:
  credit-network:
    driver: bridge